# Postgres local con las mismas migraciones que se aplican en Supabase.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pawsible
    ports:
      - "54329:5432"
    volumes:
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./scripts/init-local-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pawsible"]
      interval: 2s
      timeout: 3s
      retries: 20
